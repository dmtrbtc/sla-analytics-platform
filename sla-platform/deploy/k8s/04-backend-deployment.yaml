apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sla-platform
  labels:
    app: sla-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sla-backend
  template:
    metadata:
      labels:
        app: sla-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: sla-platform/backend:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8000
              name: metrics
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: sla-config
                  key: DATABASE_URL
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: sla-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: sla-config
                  key: REDIS_PORT
            - name: CELERY_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: sla-config
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: sla-config
                  key: CELERY_RESULT_BACKEND
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: sla-config
                  key: CORS_ORIGINS
            - name: DATA_DIR
              valueFrom:
                configMapKeyRef:
                  name: sla-config
                  key: DATA_DIR
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sla-secrets
                  key: SECRET_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sla-secrets
                  key: POSTGRES_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sla-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sla-platform
spec:
  selector:
    app: sla-backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
