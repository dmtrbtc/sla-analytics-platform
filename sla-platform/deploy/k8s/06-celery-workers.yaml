apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-default
  namespace: sla-platform
  labels:
    app: sla-celery
    queue: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sla-celery
      queue: default
  template:
    metadata:
      labels:
        app: sla-celery
        queue: default
    spec:
      containers:
        - name: worker
          image: sla-platform/backend:1.1.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.core.celery_app", "worker", "-Q", "default", "-c", "4", "--max-tasks-per-child", "1000"]
          envFrom:
            - configMapRef:
                name: sla-config
            - secretRef:
                name: sla-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
---
