apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-ha
  namespace: sla-platform
spec:
  serviceName: postgres-ha
  replicas: 2
  selector:
    matchLabels:
      app: postgres-ha
  template:
    metadata:
      labels:
        app: postgres-ha
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: sla_platform
            - name: POSTGRES_USER
              value: sla_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sla-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ha
  namespace: sla-platform
spec:
  selector:
    app: postgres-ha
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sla-platform
spec:
  selector:
    app: postgres-ha
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
