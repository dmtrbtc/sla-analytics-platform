# Observability stack for the SLA Analytics Platform.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Adds:
#   - flower: Celery task monitoring (port 5555)
#   - (Phase 5I will add Prometheus, Grafana, Loki, Promtail)

services:
  flower:
    image: mher/flower:2.0
    container_name: sla-flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin123}
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sla_network

networks:
  sla_network:
    external: true
