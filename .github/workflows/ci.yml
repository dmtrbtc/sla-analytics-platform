name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sla-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt
      - name: Lint with flake8
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --max-complexity=10 --max-line-length=120 --statistics

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sla-platform/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sla_user
          POSTGRES_PASSWORD: sla_password
          POSTGRES_DB: sla_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://sla_user:sla_password@localhost:5432/sla_platform
          SECRET_KEY: test-secret-key
        run: |
          pytest -v --timeout=30 -x --cov=app --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: sla-platform/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sla-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: sla-platform/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Backend cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache/backend
          key: ${{ runner.os }}-buildx-backend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-backend-
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./sla-platform/backend
          push: false
          tags: sla-backend:latest
          cache-from: type=local,src=/tmp/.buildx-cache/backend
          cache-to: type=local,dest=/tmp/.buildx-cache/backend-new,mode=max
      - name: Backend security scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: sla-backend:latest
          format: sarif
          output: trivy-backend.sarif
          exit-code: 0
      - name: Upload backend scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: backend
      - name: Frontend cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache/frontend
          key: ${{ runner.os }}-buildx-frontend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-frontend-
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./sla-platform/frontend
          push: false
          tags: sla-frontend:latest
          cache-from: type=local,src=/tmp/.buildx-cache/frontend
          cache-to: type=local,dest=/tmp/.buildx-cache/frontend-new,mode=max
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache/backend
          mv /tmp/.buildx-cache/backend-new /tmp/.buildx-cache/backend
          rm -rf /tmp/.buildx-cache/frontend
          mv /tmp/.buildx-cache/frontend-new /tmp/.buildx-cache/frontend
